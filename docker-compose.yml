version: "3.9"

services:
    fll-vision:
        build: .
        container_name: fll-vision
        environment:
            LEFT_GPU: 0
            RIGHT_GPU: 0
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
        volumes:
            - ./:/app # mount entire project folder, including match.mp4
        devices:
            - /dev/video0:/dev/video0
        group_add:
            - "44"
        ports:
            - "8000:8000"
        restart: unless-stopped
        shm_size: "2gb" # improves VideoCapture memory handling
